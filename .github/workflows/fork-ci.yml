# Fork-only: never part of a pull request upstream. Upstream's `checks` runs on Blacksmith, which a fork can't use,
# so this runs the touched crates' checks and the client hook test on GitHub's free runner instead.
name: fork-ci
on:
  push:
    branches: ['fork-ci/**']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the runner's preinstalled SDKs we don't use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Rust and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (touched crates)
        run: cargo clippy --locked -p horizon-mod-vocab -p horizon-client --lib --bins --tests -- -D warnings
      - name: tests (touched crates, as upstream's verify runs them)
        run: |
          cargo test --locked -p horizon-mod-vocab --lib --tests
          cargo test --locked -p horizon-client --lib --bins --tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download the pinned 26.3 game files from Mojang
        run: python3 .github/fork-ci/fetch_minecraft.py "$RUNNER_TEMP/minecraft"
      - name: Prepare the vanilla resources
        run: |
          M="$RUNNER_TEMP/minecraft"
          cargo run --locked -p horizon-prepare -- --prepare \
            --version-json "$M/versions/26.3/26.3.json" --client-jar "$M/versions/26.3/26.3.jar" \
            --server-jar "$M/server.jar" --libraries-dir "$M/libraries" --assets-dir "$M/assets" --root "$PWD"
      - name: The client hook test (needs the prepared resources)
        run: |
          HORIZON_TEST_RESOURCES="$PWD/.local/horizon-client/26.3" \
            cargo test --locked -p horizon-client --lib --bins --tests entity_event_received -- --ignored --nocapture
